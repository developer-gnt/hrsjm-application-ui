<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRSJM Admin — Dev Preview</title>
    <style>
      /* Frame the preview like a phone viewport on desktop browsers */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fa;
      }
      #root {
        max-width: 480px;
        /* Fixed constraint: top bar and bottom nav stay fixed, content
           scrolls between them. dvh keeps the mobile browser URL bar
           from covering the nav; vh is the fallback. */
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        background: #ffffff;
      }
      /* The react-native-web app wrapper must stretch to the root so
         flex: 1 screens constrain and the bottom nav stays fixed. */
      #root > div {
        height: 100%;
      }
    </style>
  <script defer src="/main.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
