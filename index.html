<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRSJM — Members (Web Preview)</title>
    <script>
      // Metro defines `global` for the RN bundle; browsers don't. RNW's
      // TimingAnimation.stop needs it. Must run before any module loads.
      window.global = window;
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f7f9fc;
      }
      /* Phone-like viewport: the app fills the window and the FlatList scrolls
         internally (header + bottom navigation stay fixed). */
      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web-entry.jsx"></script>
  </body>
</html>
