<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRSJM Mobile App</title>
    <!-- Google Fonts: Inter, Playfair Display & Caveat (docs/design.md §3) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      /* Frame the preview like a phone viewport on desktop browsers */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #011F39;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        max-width: 480px;
        /* Fixed constraint: top bar and bottom nav stay fixed, content
           scrolls between them. dvh keeps the mobile browser URL bar
           from covering the nav; vh is the fallback. */
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        background: #FAF7F0;
        box-shadow: 0 0 35px rgba(0, 0, 0, 0.35);
        position: relative;
        overflow: hidden;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      /* The react-native-web app wrapper must stretch to the root so
         flex: 1 screens constrain and the bottom nav stays fixed. */
      #root > div {
        height: 100%;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      /* React Native Web Text elements inherit base font by default unless overridden */
      [dir="auto"],
      div,
      span,
      p,
      a,
      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
