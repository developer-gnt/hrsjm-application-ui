<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HRSJM Mobile App</title>
    <!-- Google Fonts: Inter, Playfair Display & Caveat (docs/design.md §3) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-navy-950: #011F39;
        --color-navy-900: #06294D;
        --color-navy-800: #123F68;
        --color-navy-700: #174A78;

        --color-blue-100: #EDF2F7;
        --color-blue-200: #DBE5EE;

        --color-gold-500: #FAD465;
        --color-gold-600: #E9B82E;
        --color-gold-700: #C9971A;

        --color-ivory-50: #FAF7F0;
        --color-white: #FFFFFF;

        --color-text-primary: #0B2F52;
        --color-text-body: #34516D;
        --color-text-muted: #718096;
        --color-border: #DCE4EC;
        --color-overlay: #031B31;

        --font-display: "Playfair Display", Georgia, serif;
        --font-body: "Inter", Arial, sans-serif;
        --font-quote: "Caveat", cursive;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
        --space-8: 64px;
        --space-9: 80px;
        --space-10: 96px;

        --radius-card: 12px;
        --radius-button: 12px;
        --container-width: 1200px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #011F39;
        font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      #root {
        max-width: 1200px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        background: #FAF7F0;
        box-shadow: 0 0 45px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #root > div {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
